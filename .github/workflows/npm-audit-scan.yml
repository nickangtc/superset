name: NPM Audit Scan

on:
  schedule:
    - cron: "0 5 * * *" # daily at 5 AM UTC; exact hour is arbitrary
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: npm-audit-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: "./superset-frontend/.nvmrc"

      - name: Run npm audit
        shell: bash
        run: |
          audit_status=0
          cd superset-frontend
          npm audit --json --audit-level=high > ../npm-audit.json || audit_status=$?
          echo "npm audit exited with status ${audit_status}"
          if [[ ! -s ../npm-audit.json ]]; then
            echo '{"vulnerabilities":{}}' > ../npm-audit.json
          fi

      - name: Create or update npm audit issues
        env:
          GITHUB_TOKEN: ${{ secrets.ISSUE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/npm_audit_create_issues.py npm-audit.json
