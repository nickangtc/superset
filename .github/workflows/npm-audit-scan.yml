name: NPM Audit Scan

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: npm-audit-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Gate scheduled runs to 5am Berlin time
        id: berlin-time
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$(TZ=Europe/Berlin date +%H)" == "05" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.berlin-time.outputs.should_run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        if: steps.berlin-time.outputs.should_run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: "./superset-frontend/.nvmrc"

      - name: Run npm audit
        if: steps.berlin-time.outputs.should_run == 'true'
        shell: bash
        run: |
          audit_status=0
          cd superset-frontend
          npm audit --json --audit-level=high > ../npm-audit.json || audit_status=$?
          echo "npm audit exited with status ${audit_status}"
          if [[ ! -s ../npm-audit.json ]]; then
            echo '{"vulnerabilities":{}}' > ../npm-audit.json
          fi

      - name: Create or update npm audit issues
        if: steps.berlin-time.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ISSUE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/npm_audit_create_issues.py npm-audit.json
