name: NPM Audit Devin Dispatch

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Open npm-audit issue number to remediate"
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: npm-audit-devin-dispatch-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  dispatch-devin:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'devin-remediate'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Dispatch Devin remediation session
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || github.event.issue.number }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID || secrets.DEVIN_ORG_ID }}
          PLAYBOOK_PATH: .github/devin-playbooks/npm-audit-remediation.md
        run: python3 .github/scripts/npm_audit_dispatch_devin.py
